# fly.toml app configuration file generated for train-feelings
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'train-feelings'
primary_region = 'ewr'

[build]

[env]
  DATA_DIR = '/data'
  DATABASE_PATH = '/data/trains.db'
  DATA_SOURCE = 'local'
  COLLECTOR_ENABLED = 'true'
  POLL_INTERVAL_SECONDS = '30'
  DATA_RETENTION_HOURS = '2'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = 'train_feelings_data'
  destination = '/data'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
